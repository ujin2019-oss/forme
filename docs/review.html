<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORME. 반응형·기능 검수</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#ddd9d0;color:#262722;margin:24px}h1{font-size:24px}p{line-height:1.7;font-size:14px}button{min-height:44px;padding:10px 14px;margin:0 8px 12px 0;border:1px solid #aaa;background:#f1eee7;cursor:pointer}main{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.review{background:#f1eee7;padding:16px}h2{font-size:16px}.status{font-size:13px;font-weight:bold}.fail{color:#8d2b1c}pre{font-size:11px;white-space:pre-wrap;max-width:540px}details{margin:14px 0}.viewport{position:relative;overflow:hidden}iframe{border:0;transform-origin:top left;position:absolute;left:0;top:0}
</style>
</head>
<body>
<h1>FORME. 반응형·기능 검수</h1>
<p>1440 · 1024 · 768 · 390 · 360px의 실제 iframe 뷰포트입니다. 이 화면을 HTTP 서버에서 열면 각 검사가 실행됩니다. PASS는 자동 검사 범위의 결과이며, 이미지 크롭·텍스트 대비·키보드와 터치의 실제 사용성은 별도로 시각 검수하세요.</p>
<nav aria-label="검수 섹션" id="sections"></nav><main></main>
<script>
const sizes=[[1440,960,.38],[1024,900,.4],[768,1024,.48],[390,844,.9],[360,800,.9]];
const sections=[['HERO','.hero'],['PHILOSOPHY','#philosophy'],['ESSENTIALS','#essentials'],['TEXTURE','#texture'],['RITUAL','#ritual'],['CAMPAIGN','#campaign'],['FORMULA','#formula'],['JOURNAL','#journal'],['CLOSING','.closing']];
const nextFrame=win=>new Promise(resolve=>win.requestAnimationFrame(()=>resolve()));
for(const [label,selector] of sections){
  const button=document.createElement('button');button.textContent=label;
  button.onclick=()=>document.querySelectorAll('iframe').forEach(frame=>{
    const doc=frame.contentDocument,element=doc.querySelector(selector);
    frame.contentWindow.scrollTo({top:element.offsetTop-parseFloat(frame.contentWindow.getComputedStyle(doc.documentElement).getPropertyValue('--header'))-16,behavior:'instant'});
  });document.querySelector('nav').append(button);
}
async function waitForRitual(frame){
  const deadline=performance.now()+2500;
  while(frame.contentDocument.querySelector('#ritual-image-stage').getAttribute('aria-busy')==='true'){
    if(performance.now()>deadline)throw new Error('루틴 이미지 전환 시간 초과');
    await nextFrame(frame.contentWindow);
  }
}
async function audit(frame,card,width){
  const doc=frame.contentDocument,win=frame.contentWindow,output=[];
  const check=(name,condition)=>output.push({name,passed:Boolean(condition)});
  await doc.fonts.ready;
  const style=doc.createElement('style');
  style.textContent='html{scroll-behavior:auto!important}.reveal{opacity:1!important;transform:none!important}';
  doc.head.append(style);
  for(const image of doc.images)image.loading='eager';
  await Promise.all([...doc.images].map(img=>img.decode().catch(()=>{})));
  await nextFrame(win);
  check('가로 스크롤 없음',doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+1);
  check('본문 이미지 15개 로드',[...doc.querySelectorAll('main img')].length===15&&[...doc.querySelectorAll('main img')].every(img=>img.naturalWidth>0));
  check('히어로 CTA → 제품',doc.querySelector('.hero-cta').getAttribute('href')==='#essentials');
  const expected=['cleanser','toner','serum','cream'];
  for(const key of ['serum','cream','cleanser','toner']){
    const trigger=doc.querySelector(`.product-card [data-product="${key}"]`);
    trigger.click();
    check(`${key} 상세 모달`,doc.querySelector('dialog').open&&doc.querySelector('#dialog-title').textContent===trigger.textContent);
    doc.querySelector('.dialog-close').click();await nextFrame(win);
    check(`${key} 닫은 뒤 포커스`,doc.activeElement===trigger);
  }
  for(const [index,button] of [...doc.querySelectorAll('[data-step]')].entries()){
    button.click();await waitForRitual(frame);
    check(`STEP ${index+1} 제품·사진·설명 일치`,button.dataset.ritualProduct===expected[index]&&doc.querySelector('#ritual-image').getAttribute('src')===`assets/images/${expected[index]}.jpg`&&doc.getElementById(button.getAttribute('aria-controls')).querySelector('[data-product]').dataset.product===expected[index]);
    check(`STEP ${index+1} 하나만 펼침`,doc.querySelectorAll('[data-step][aria-expanded="true"]').length===1&&doc.querySelectorAll('.step-content:not([hidden])').length===1);
  }
  const steps=[...doc.querySelectorAll('[data-step]')];
  steps[1].click();steps[2].click();steps[3].click();await waitForRitual(frame);
  check('빠른 선택 후 마지막 이미지 유지',doc.querySelector('#ritual-image').getAttribute('src')==='assets/images/cream.jpg'&&doc.querySelectorAll('.ritual-image-stage img').length===1);
  steps[0].focus();steps[0].dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));
  check('방향키 루틴 탐색',doc.activeElement===steps[3]);
  for(const key of ['routine','object','self']){
    const trigger=doc.querySelector(`[data-article="${key}"]`);trigger.click();
    check(`저널 ${key} 기존 본문`,doc.querySelector('dialog').open&&doc.querySelector('#dialog-title').textContent===trigger.textContent);
    doc.querySelector('.dialog-close').click();await nextFrame(win);
  }
  for(const key of ['formula','contact','social','business']){
    doc.querySelector(`[data-info="${key}"]`).click();check(`정보 ${key}`,doc.querySelector('dialog').open);
    doc.querySelector('.dialog-close').click();await nextFrame(win);
  }
  if(width<768){
    check('햄버거 없이 메뉴 표시',!doc.querySelector('.menu-toggle')&&win.getComputedStyle(doc.querySelector('.desktop-nav')).display==='flex');
    check('제품명 16px 이상',[...doc.querySelectorAll('.product-name h3')].every(item=>parseFloat(win.getComputedStyle(item).fontSize)>=16));
    check('모바일 히어로 제품 크롭 방지',win.getComputedStyle(doc.querySelector('.hero-image')).objectFit==='contain');
  }
  const overflow=[...doc.querySelectorAll('main h1,main h2,main h3,.product-card,.journal-card')].filter(item=>{
    const rect=item.getBoundingClientRect();return rect.left< -1||rect.right>doc.documentElement.clientWidth+1;
  });
  check('헤드라인·카드 화면 밖 넘침 없음',overflow.length===0);
  steps[0].click();await waitForRitual(frame);doc.activeElement?.blur();win.scrollTo({top:0,behavior:'instant'});
  card.querySelector('pre').textContent=output.map(item=>`${item.passed?'PASS':'FAIL'} ${item.name}`).join('\n');
  const failed=output.filter(item=>!item.passed).length;
  card.querySelector('.status').textContent=`${output.length-failed}/${output.length} PASS${failed?' — 확인 필요':''}`;
  card.querySelector('.status').classList.toggle('fail',failed>0);
}
for(const [width,height,scale] of sizes){
  const card=document.createElement('section');card.className='review';
  card.innerHTML=`<h2>${width} × ${height}</h2><div class="status">검사 중…</div><details><summary>검사 결과</summary><pre></pre></details><div class="viewport" style="width:${width*scale}px;height:${height*scale}px"><iframe title="${width}px 검수" src="../index.html" width="${width}" height="${height}" style="transform:scale(${scale})"></iframe></div>`;
  const frame=card.querySelector('iframe');frame.onload=()=>audit(frame,card,width).catch(error=>{card.querySelector('.status').textContent=error.message;card.querySelector('.status').classList.add('fail');});document.querySelector('main').append(card);
}
</script>
</body>
</html>
